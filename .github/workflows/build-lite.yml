name: Build PonWrt Lite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Packages
        run: |
          CONF="configs/an7581.config"
          echo "CONFIG_PACKAGE_lua=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-lua-runtime=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-compat=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-argon-config=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> $CONF
          echo "CONFIG_PACKAGE_ttyd=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-autoreboot=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-commands=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-smartdns=y" >> $CONF
          echo "CONFIG_PACKAGE_smartdns=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-advanced=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-arpbind=y" >> $CONF
          echo "CONFIG_PACKAGE_nano=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-usb3=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-usb-storage-uas=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-usb-net-rndis=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y" >> $CONF
          echo "CONFIG_PACKAGE_usbutils=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-diskman=y" >> $CONF
          echo "CONFIG_PACKAGE_block-mount=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-fs-exfat=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-fs-vfat=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-fs-ntfs3=y" >> $CONF
          echo "CONFIG_PACKAGE_exfatprogs=y" >> $CONF
          echo "CONFIG_PACKAGE_parted=y" >> $CONF
          echo "CONFIG_PACKAGE_e2fsprogs=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-fuse=y" >> $CONF
          echo "CONFIG_PACKAGE_fuse3=y" >> $CONF
          echo "CONFIG_PACKAGE_fuse-utils=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-8021q=y" >> $CONF
          echo "CONFIG_PACKAGE_vconfig=y" >> $CONF
          echo "CONFIG_PACKAGE_igmpproxy=y" >> $CONF
          echo "CONFIG_PACKAGE_udpxy=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-udpxy=y" >> $CONF

      - name: Load Config & Customize Defaults
        run: |
          cp configs/an7581.config .config
          make defconfig
          sed -i 's/192.168.[0-9]*.1/192.168.1.1/g' package/base-files/files/bin/config_generate
          rm -rf files
          mkdir -p files/etc/uci-defaults
          echo '#!/bin/sh' > files/etc/uci-defaults/99-custom
          echo 'uci set system.@system[0].timezone=CST-8' >> files/etc/uci-defaults/99-custom
          echo 'uci set system.@system[0].zonename=Asia/Shanghai' >> files/etc/uci-defaults/99-custom
          echo 'uci set luci.main.mediaurlbase=/luci-static/argon' >> files/etc/uci-defaults/99-custom
          echo 'uci set wireless.radio0.country=CN' >> files/etc/uci-defaults/99-custom
          echo 'uci set wireless.radio1.country=CN' >> files/etc/uci-defaults/99-custom
          echo 'uci set wireless.radio0.htmode=HT40' >> files/etc/uci-defaults/99-custom
          echo 'uci set wireless.radio1.htmode=VHT160' >> files/etc/uci-defaults/99-custom
          echo 'uci set wireless.radio0.disabled=0' >> files/etc/uci-defaults/99-custom
          echo 'uci set wireless.radio1.disabled=0' >> files/etc/uci-defaults/99-custom
          echo 'uci set wireless.default_radio0.ssid=ImmortalWrt' >> files/etc/uci-defaults/99-custom
          echo 'uci set wireless.default_radio1.ssid=ImmortalWrt' >> files/etc/uci-defaults/99-custom
          echo 'uci set wireless.default_radio0.encryption=none' >> files/etc/uci-defaults/99-custom
          echo 'uci set wireless.default_radio1.encryption=none' >> files/etc/uci-defaults/99-custom
          echo 'uci set wireless.default_radio0.disabled=0' >> files/etc/uci-defaults/99-custom
          echo 'uci set wireless.default_radio1.disabled=0' >> files/etc/uci-defaults/99-custom
          echo 'uci commit system' >> files/etc/uci-defaults/99-custom
          echo 'uci commit luci' >> files/etc/uci-defaults/99-custom
          echo 'uci commit wireless' >> files/etc/uci-defaults/99-custom
          echo 'exit 0' >> files/etc/uci-defaults/99-custom
          chmod +x files/etc/uci-defaults/99-custom

      - name: Download Sources
        run: make download -j8

      - name: Compile
        run: make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v7
        with:
          name: PonWrt-Lite
          path: bin/targets/airoha/an7581/
