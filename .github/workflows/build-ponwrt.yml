name: Build PonWrt Custom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Packages
        run: |
          CONF="configs/an7581.config"

          # --- 1. 主题修复与基础运行环境 ---
          echo "CONFIG_PACKAGE_lua=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-lua-runtime=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-compat=y" >> $CONF

          # --- 2. Argon 主题 ---
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-argon-config=y" >> $CONF

          # --- 3. 基础功能与系统工具 ---
          echo "CONFIG_PACKAGE_luci-app-adblock=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-ddns-go=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> $CONF
          echo "CONFIG_PACKAGE_ttyd=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-autoreboot=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-commands=y" >> $CONF

          # --- 4. USB 基础支持 ---
          echo "CONFIG_PACKAGE_kmod-usb3=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-usb-storage-uas=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-usb-net-rndis=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y" >> $CONF

          # --- 5. U 盘文件管理 (Harbor File) ---
          echo "CONFIG_PACKAGE_luci-app-harbor-file=y" >> $CONF

          # --- 6. U 盘磁盘管理 (DiskMan) ---
          echo "CONFIG_PACKAGE_luci-app-diskman=y" >> $CONF

          # --- 7. DNS 优化 (SmartDNS) ---
          echo "CONFIG_PACKAGE_luci-app-smartdns=y" >> $CONF
          echo "CONFIG_PACKAGE_smartdns=y" >> $CONF

          # --- 8. 系统高级设置 (Advanced) ---
          echo "CONFIG_PACKAGE_luci-app-advanced=y" >> $CONF

          # --- 9. IP-MAC 绑定 (ARP Bind) ---
          echo "CONFIG_PACKAGE_luci-app-arpbind=y" >> $CONF

          # --- 10. 文本编辑器 ---
          echo "CONFIG_PACKAGE_nano=y" >> $CONF

          # --- 11. OpenClash 及其核心依赖 ---
          echo "CONFIG_PACKAGE_luci-app-openclash=y" >> $CONF
          echo "CONFIG_PACKAGE_bash=y" >> $CONF
          echo "CONFIG_PACKAGE_curl=y" >> $CONF
          echo "CONFIG_PACKAGE_ca-bundle=y" >> $CONF
          echo "CONFIG_PACKAGE_ip-full=y" >> $CONF
          echo "CONFIG_PACKAGE_ruby=y" >> $CONF
          echo "CONFIG_PACKAGE_ruby-yaml=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-tun=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-inet-diag=y" >> $CONF
          echo "CONFIG_PACKAGE_unzip=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-nft-tproxy=y" >> $CONF
          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> $CONF
          echo "CONFIG_PACKAGE_dnsmasq=y" >> $CONF

          # --- 12. UU 加速器依赖 ---
          echo "CONFIG_PACKAGE_jq=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-nf-conntrack-netlink=y" >> $CONF

          # --- 13. IPTV 功能 ---
          echo "CONFIG_PACKAGE_igmpproxy=y" >> $CONF
          echo "CONFIG_PACKAGE_udpxy=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-udpxy=y" >> $CONF

      - name: Load Config & Customize Defaults
        run: |
          cp configs/an7581.config .config
          make defconfig

          # --- WiFi 默认配置 ---
          WIRELESS="package/base-files/files/etc/config/wireless"
          if [ -f "$WIRELESS" ]; then
            sed -i "s/option ssid .*/option ssid 'ImmortalWrt'/" $WIRELESS
            sed -i "s/option country .*/option country 'CN'/" $WIRELESS
            sed -i "s/option encryption .*/option encryption 'none'/" $WIRELESS
            sed -i "s/option txpower .*/option txpower '27'/" $WIRELESS
          fi

          # --- 修改默认 LAN IP ---
          sed -i 's/192.168.[0-9]*.1/192.168.1.1/g' package/base-files/files/bin/config_generate

          # --- 强制默认主题为 Argon，避免 aurora 加载报错 ---
          LUCICFG="package/base-files/files/etc/config/luci"
          mkdir -p "$(dirname "$LUCICFG")"
          if [ -f "$LUCICFG" ]; then
            sed -i "s|option mediaurlbase .*|option mediaurlbase '/luci-static/argon'|" "$LUCICFG"
          else
            cat > "$LUCICFG" <<'EOF'
config core 'main'
    option lang 'auto'
    option mediaurlbase '/luci-static/argon'
    option resourcebase '/luci-static/resources'

config extern 'flash_keep'
    option uci_configs_enabled '1'
    option uci_configs_preserve '1'
    option uhttpd_acl_enabled '1'
    option dropbear_acl_enabled '1'
    option backup_config '1'

config internal 'languages'
    option en 'English'
    option zh_cn '简体中文'

config internal 'sauth'
    option sessionpath '/tmp/luci-sessions'
    option sessiontim
