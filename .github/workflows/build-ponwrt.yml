name: Build PonWrt for HG5585F-CT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # 编译失败立即停止，不浪费时间继续
    strategy:
      fail-fast: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Packages
        run: |
          CONF="configs/an7581.config"
          
          # --- 1. 修复主题 & 基础运行环境 ---
          echo "CONFIG_PACKAGE_lua=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-lua-runtime=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-compat=y" >> $CONF
          
          # --- 2. 基础功能 & 系统工具 ---
          echo "CONFIG_PACKAGE_luci-app-adblock=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-ddns-go=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-autoreboot=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-commands=y" >> $CONF
          
          # --- 3. USB 基础支持 ---
          echo "CONFIG_PACKAGE_kmod-usb3=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-usb-storage-uas=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-usb-net-rndis=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y" >> $CONF
          
          # --- 4. U 盘文件管理 ---
          echo "CONFIG_PACKAGE_luci-app-filebrowser=y" >> $CONF
          echo "CONFIG_PACKAGE_filebrowser=y" >> $CONF
          
          # --- 5. UU 加速器依赖 ---
          echo "CONFIG_PACKAGE_curl=y" >> $CONF
          echo "CONFIG_PACKAGE_jq=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-tun=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-nf-conntrack-netlink=y" >> $CONF
          
          # --- 6. IPTV 功能 ---
          echo "CONFIG_PACKAGE_igmpproxy=y" >> $CONF
          echo "CONFIG_PACKAGE_udpxy=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-udpxy=y" >> $CONF

      - name: Load Config & Customize Defaults
        run: |
          cp configs/an7581.config .config
          make defconfig
          
          # --- WiFi 默认配置 ---
          WIRELESS="package/base-files/files/etc/config/wireless"
          if [ -f "$WIRELESS" ]; then
            sed -i "s/option ssid .*/option ssid 'ImmortalWrt'/" $WIRELESS
            sed -i "s/option country .*/option country 'CN'/" $WIRELESS
            sed -i "s/option encryption .*/option encryption 'none'/" $WIRELESS
            sed -i "s/option txpower .*/option txpower '27'/" $WIRELESS
          fi
          
          # --- 修改默认 LAN IP ---
          sed -i 's/192.168.[0-9]*.1/192.168.1.1/g' package/base-files/files/bin/config_generate

      - name: Download Sources
        run: make download -j8

      - name: Compile
        run: make -j$(nproc)

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-HG5585F-CT
          path: bin/targets/airoha/an7581/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Lite Packages
        if: github.event.inputs.version == 'lite'
        run: |
          CONF="configs/${{ matrix.config }}"
          echo "CONFIG_PACKAGE_luci-app-adblock=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-ddns-go=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> $CONF
          echo "CONFIG_PACKAGE_ttyd=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-autoreboot=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-advanced-reboot=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-wifischedule=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-commands=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-usb3=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-usb-storage-uas=y" >> $CONF

      - name: Inject Full Packages
        if: github.event.inputs.version == 'full'
        run: |
          CONF="configs/${{ matrix.config }}"
          echo "CONFIG_PACKAGE_luci-app-adblock=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-ddns-go=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> $CONF
          echo "CONFIG_PACKAGE_ttyd=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-autoreboot=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-advanced-reboot=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-wifischedule=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-commands=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-usb3=y" >> $CONF
          echo "CONFIG_PACKAGE_kmod-usb-storage-uas=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-samba4=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-diskman=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-aria2=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-usb-printer=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-minidlna=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-app-hd-idle=y" >> $CONF

      - name: Load Config & Customize Defaults
        run: |
          cp configs/${{ matrix.config }} .config
          make defconfig

          WIRELESS="package/base-files/files/etc/config/wireless"
          if [ -f "$WIRELESS" ]; then
            sed -i "s/option ssid .*/option ssid 'ImmortalWrt'/" $WIRELESS
            sed -i "s/option country .*/option country 'CN'/" $WIRELESS
            sed -i "s/option encryption .*/option encryption 'none'/" $WIRELESS
            sed -i "s/option txpower .*/option txpower '27'/" $WIRELESS
          fi

          sed -i 's/192.168.[0-9]*.1/192.168.1.1/g' package/base-files/files/bin/config_generate

      - name: Download Sources
        run: make download -j8

      - name: Compile
        run: make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-${{ matrix.device }}-${{ github.event.inputs.version }}
          path: bin/targets/airoha/*/
