name: Build PonWrt Full

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Packages
        run: |
          CONF="configs/an7581.config"
          for pkg in lua luci-lua-runtime luci-compat luci-theme-argon luci-app-argon-config \
            luci-app-adblock luci-app-ddns-go luci-app-ttyd ttyd luci-app-autoreboot \
            luci-app-commands luci-app-smartdns smartdns luci-app-advanced luci-app-arpbind nano \
            kmod-usb3 kmod-usb-storage-uas kmod-fs-ext4 kmod-fs-exfat kmod-fs-ntfs3 ntfs-3g \
            kmod-usb-net-rndis kmod-usb-net-cdc-ether usb-modeswitch \
            luci-app-harbor-file luci-app-diskman luci-app-samba4 luci-app-hd-idle \
            luci-app-nlbwmon luci-app-htop luci-app-upnp \
            kmod-8021q vconfig \
            luci-app-openclash bash curl ca-bundle ip-full ruby ruby-yaml kmod-tun \
            kmod-inet-diag unzip kmod-nft-tproxy dnsmasq-full dnsmasq \
            jq kmod-nf-conntrack-netlink igmpproxy udpxy luci-app-udpxy; do
            echo "CONFIG_PACKAGE_${pkg}=y" >> $CONF
          done

      - name: Load Config & Customize Defaults
        run: |
          cp configs/an7581.config .config
          make defconfig

          WIRELESS="package/base-files/files/etc/config/wireless"
          if [ -f "$WIRELESS" ]; then
            sed -i "s/option ssid .*/option ssid 'ImmortalWrt'/" $WIRELESS
            sed -i "s/option country .*/option country 'CN'/" $WIRELESS
            sed -i "s/option encryption .*/option encryption 'none'/" $WIRELESS
            sed -i "s/option txpower .*/option txpower '27'/" $WIRELESS
          fi

          mkdir -p files/etc/config
          printf '%s\n' \
            "config system" \
            "    option hostname 'ImmortalWrt'" \
            "    option timezone 'CST-8'" \
            "    option zonename 'Asia/Shanghai'" \
            > files/etc/config/system

          sed -i 's/192.168.[0-9]*.1/192.168.1.1/g' package/base-files/files/bin/config_generate

          LUCICFG="package/base-files/files/etc/config/luci"
          if [ -f "$LUCICFG" ]; then
            sed -i "s|option mediaurlbase .*|option mediaurlbase '/luci-static/argon'|" "$LUCICFG"
          fi

      - name: Download Sources
        run: make download -j8

      - name: Compile
        run: make -j$(nproc)

      - name: Upload Firmware
        uses: actions/upload-artifact@v7
        with:
          name: PonWrt-Full
          path: bin/targets/airoha/an7581/
