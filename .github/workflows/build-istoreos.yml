name: Build PonWrt iStoreOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Update Feeds
        run: |
          echo "src-git istore https://github.com/linkease/istore;main" >> feeds.conf.default
          echo "src-git nas https://github.com/linkease/nas-packages.git;master" >> feeds.conf.default
          echo "src-git nas_luci https://github.com/linkease/nas-packages-luci.git;main" >> feeds.conf.default
          echo "src-git quickstart https://github.com/istoreos/quickstart.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Packages
        run: |
          CONF="configs/an7581.config"
          echo "CONFIG_PACKAGE_lua=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-lua-runtime=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-compat=y" >> $CONF
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> $CONF
