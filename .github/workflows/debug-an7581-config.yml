name: Debug AN7581 config

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Feeds
        run: |
          ./scripts/feeds update -a >/dev/null
          ./scripts/feeds install -a >/dev/null

      - name: Configure and report
        run: |
          cp configs/an7581.config .config
          cat configs/an7581-tyfza1-packages.config >> .config
          make defconfig
          echo "=== selected python3 symbols ==="
          grep -E '^CONFIG_PACKAGE_python3' .config || true
          echo "=== fragment python3 lines ==="
          grep -n 'python3' configs/an7581-tyfza1-packages.config || true
          echo "=== who selects python3 (kconfig depends) ==="
          grep -n -B2 -A2 'PACKAGE_python3\b' tmp/.config-package.in | head -n 60 || true
