name: Build HG5380A (AN7583 FiberHome)

# 适配 Li-tian-suo/ponwrt（pbs05/ponwrt 的 fork）
# 前置：仓库里需要有 board/ 目录（本包提供的两个文件）
on:
  push:
    branches:
      - master
      - Ponwrt-5380A
  workflow_dispatch:
    inputs:
      profile:
        description: '构建档位：minimal=最小验证版（推荐首次），full=完整包集合'
        type: choice
        options:
          - minimal
          - full
        default: minimal

# 同一分支只保留最新一次构建。
# 一次全量编译要 60~120 分钟，之前连续推送几次修复，导致 4 个构建并行跑，
# 每个都在验证几乎同一件事，白烧 runner 时间。
# 加了 cancel-in-progress 后，新推送会自动取消同分支的旧构建。
# 注意：只对同 ref 生效，main/Ponwrt-5380A 之间互不影响。
concurrency:
  group: hg5380a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Apply board files
        run: |
          test -f board/an7583-fiberhome-hg5380a.dts
          cp board/an7583-fiberhome-hg5380a.dts target/linux/airoha/dts/

          # 仓库自带的 an7583.mk 里已经有一份 Device/fiberhome_hg5380a，
          # 但它的 DEVICE_PACKAGES 是从 AN7581 抄来的，含 kmod-airoha-paged-bosa。
          # 该包在 openwrt-pon-drivers 里的声明是：
          #     DEPENDS:=@TARGET_airoha_an7581 +kmod-airoha-pon-frontend
          # 即只对 AN7581 可见，AN7583 下根本不存在这个符号。结果镜像打包时报：
          #     ERROR: unable to select packages:
          #       kmod-airoha-paged-bosa (no such package)
          # AN7583 用的是 EN7572 前端，正确的 DEVICE_PACKAGES 在 snippet 里。
          #
          # 原来的写法是 `if ! grep -q fiberhome_hg5380a ...; then 追加`，
          # 因为旧定义已经存在，grep 命中，snippet 永远不会被追加。
          # 改为：先精确删掉旧块（含 TARGET_DEVICES 行，避免重复注册），再追加。
          python3 - <<'PY'
          import re, pathlib, sys
          p = pathlib.Path('target/linux/airoha/image/an7583.mk')
          s = p.read_text()
          pat = re.compile(
              r'define Device/fiberhome_hg5380a\n(?:.*?\n)*?endef\n'
              r'TARGET_DEVICES \+= fiberhome_hg5380a\n'
          )
          new, n = pat.subn('', s, count=1)
          if n != 1:
              sys.exit('ERROR: 未找到旧的 Device/fiberhome_hg5380a 定义，'
                       '请检查 an7583.mk 结构是否变化')
          p.write_text(new)
          print('removed old Device/fiberhome_hg5380a block')
          PY

          cat board/an7583.mk.snippet >> target/linux/airoha/image/an7583.mk

          echo "--- 应用后的 device 定义 ---"
          sed -n '/define Device\/fiberhome_hg5380a/,/^TARGET_DEVICES += fiberhome_hg5380a/p' \
            target/linux/airoha/image/an7583.mk
          # kmod-airoha-paged-bosa 必须出现：本机光模块是 UX3363，
          # 只有这个包里的 airoha-paged-bosa-ux3363.c 能驱动它。
          # 上游 feed 给这个包的 DEPENDS 只写了 @TARGET_airoha_an7581，
          # AN7583 下选不中；由下面的 "Patch pon-drivers for AN7583" 步骤修正。
          #
          # sed 先把注释剥掉再 grep，避免命中说明性注释。
          if ! sed 's/#.*//' target/linux/airoha/image/an7583.mk | grep -q 'paged-bosa'; then
            echo "::error::an7583.mk 缺少 kmod-airoha-paged-bosa，UX3363 光模块将无驱动可用"
            exit 1
          fi

      - name: Trim feeds
        env:
          PROFILE: ${{ inputs.profile || 'minimal' }}
        run: |
          # 两个档位都删掉对 HG5380A 完全无用的 feed。
          #
          # 已核实：minimal 档选中 16 个包、full 档 138 个包，
          # 其中没有任何一个来自 video 或 telephony —— 这台设备是纯
          # 路由/PON 网关，既不播视频也不用 Asterisk。
          #
          # video    : 含 qt5，有已知的 Kconfig 递归依赖（原注释记的就是这个）
          # telephony: 含 asterisk/freeswitch 等，体量大且用不到
          #
          # 删掉后能减少克隆体积，也让 make defconfig 少解析大量无关 Kconfig。
          sed -i '/^src-git video /d; /^src-git telephony /d' feeds.conf.default
          echo "profile = $PROFILE"
          cat feeds.conf.default

      - name: Fix exec bits
        run: |
          # 从 Windows 工作区导入时 NTFS 会丢失 Unix 可执行位，
          # 这里统一补一遍，避免 scripts/feeds、config/check-*.sh 等报 Permission denied
          chmod +x scripts/* config/* 2>/dev/null || true
          find . -maxdepth 3 -name '*.sh' -not -path './build_dir/*' -not -path './staging_dir/*' -exec chmod +x {} + 2>/dev/null || true
          echo "--- 抽查 ---"
          ls -l scripts/feeds config/check-uname.sh 2>/dev/null || true
      - name: Update feeds
        run: ./scripts/feeds update -a

      - name: Patch pon-drivers for AN7583
        run: |
          # 上游 openwrt-pon-drivers 的 airoha-pon-frontends/Makefile 里，
          # airoha-pon-frontend 和 airoha-en7572 的 DEPENDS 都是
          #   @(TARGET_airoha_an7581||TARGET_airoha_an7583)
          # 唯独 airoha-paged-bosa 只写了 @TARGET_airoha_an7581。
          # 后果：AN7583 设备在 Kconfig 里看不到这个包 → 选不中 → 不进镜像
          # → DTS 里的 BOSA 节点无人绑定 → airoha_pon_frontend_get()
          # 拿不到 provider → airoha-xpon probe 失败 → pon0 不出现。
          #
          # 光模块是 UX3363，该驱动就在 airoha-paged-bosa.ko 里。
          f=feeds/pon_drivers/airoha-pon-frontends/Makefile
          test -f "$f" || { echo "::error::$f 不存在，feed 结构变了"; exit 1; }
          echo "--- 打补丁前 ---"
          grep -n 'DEPENDS' "$f"
          patch -p1 -d feeds/pon_drivers < board/airoha-paged-bosa-an7583.patch
          echo "--- 打补丁后 ---"
          grep -n 'DEPENDS' "$f"
          n=$(grep -c 'TARGET_airoha_an7583' "$f")
          if [ "$n" != "3" ]; then
            echo "::error::期望 3 个包都支持 AN7583，实际 $n 个"
            exit 1
          fi
          echo "OK: 三个 PON 前端包都支持 AN7583"

      - name: Provide libffi
        run: |
          # immortalwrt/packages 缺 libs/libffi，任何拉入 python3 的配置都会失败
          git clone --depth 1 --filter=blob:none --sparse https://github.com/openwrt/openwrt /tmp/owrt
          git -C /tmp/owrt sparse-checkout set package/libs/libffi
          mkdir -p package/libs
          cp -a /tmp/owrt/package/libs/libffi package/libs/

      - name: Install feeds
        run: ./scripts/feeds install -a

      - name: Drop packages with Kconfig recursion
        # 这两组包在 feeds 的 Kconfig 里互相 select，触发 kconfig 的
        # "recursive dependency detected!"：
        #
        #   PACKAGE_fwknopd 被 PACKAGE_luci-app-fwknopd select
        #   PACKAGE_luci-app-fwknopd depends on FWKNOPD_GPG
        #   FWKNOPD_GPG depends on PACKAGE_fwknopd
        #
        #   PACKAGE_squeezelite-custom depends on SQUEEZELITE_WMA_ALAC
        #   SQUEEZELITE_WMA_ALAC depends on PACKAGE_squeezelite-custom
        #
        # 这不会中止 make defconfig，但 kconfig 明确提示递归时生成的 .config
        # 可能不正确。两个档位都用不到这两个包，直接移除包目录从源头消除。
        run: |
          for d in feeds/packages/net/fwknop \
                   feeds/packages/sound/squeezelite \
                   feeds/luci/applications/luci-app-fwknopd; do
            if [ -e "$d" ]; then rm -rf "$d"; echo "removed $d"
            else echo "absent  $d"; fi
          done
          rm -rf package/feeds/packages/fwknop \
                 package/feeds/packages/squeezelite \
                 package/feeds/luci/luci-app-fwknopd 2>/dev/null || true

      - name: Configure
        env:
          PROFILE: ${{ inputs.profile || 'minimal' }}
        run: |
          echo "profile = $PROFILE"
          if [ "$PROFILE" = "full" ]; then
            cp configs/an7583.config .config
            sed -i '/^CONFIG_TARGET_DEVICE_airoha_an7583_DEVICE_/d' .config
            echo 'CONFIG_TARGET_DEVICE_airoha_an7583_DEVICE_fiberhome_hg5380a=y' >> .config
            if [ -f configs/hg5380a-packages.config ]; then
              grep '^CONFIG_PACKAGE_' configs/hg5380a-packages.config >> .config || true
            fi
          else
            # 最小验证版：用已知可用的 an7583.config 打底（保留 target/内核元数据），
            # 但去掉所有已选中的软件包，只留 LuCI 基础与必备件。
            cp configs/an7583.config .config
            grep -v '^CONFIG_PACKAGE_[A-Za-z0-9_.-]*=y$' .config > .config.trim || true
            mv .config.trim .config
            sed -i '/^CONFIG_TARGET_DEVICE_airoha_an7583_DEVICE_/d' .config
            echo 'CONFIG_TARGET_DEVICE_airoha_an7583_DEVICE_fiberhome_hg5380a=y' >> .config
            cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-pon=y
          CONFIG_PACKAGE_airoha-en8811h-firmware=y
          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_kmod-phy-airoha-en8811h=y
          CONFIG_PACKAGE_kmod-airoha-en7572=y
          CONFIG_PACKAGE_kmod-airoha-xpon=y
          CONFIG_PACKAGE_airoha-ponctl=y
          CONFIG_PACKAGE_airoha-pond=y
          # CONFIG_PACKAGE_luci-app-fwknopd is not set
          # CONFIG_PACKAGE_squeezelite-custom is not set
          EOF
            sed -i 's/^ *//' .config
          fi
          # 两个档位都要的板级驱动与 PON 组件（设备级 DEVICE_PACKAGES 在本仓库不生效，显式加）
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_kmod-phy-airoha-en8811h=y
          CONFIG_PACKAGE_kmod-airoha-en7572=y
          CONFIG_PACKAGE_kmod-airoha-xpon=y
          CONFIG_PACKAGE_airoha-ponctl=y
          CONFIG_PACKAGE_airoha-pond=y
          CONFIG_PACKAGE_luci-app-pon=y
          CONFIG_PACKAGE_airoha-en8811h-firmware=y
          EOF
          sed -i 's/^ *//' .config
          make defconfig
          echo "--- device selection ---"
          grep -E '^CONFIG_TARGET_DEVICE_airoha' .config | grep '=y' || {
            echo "设备未被选中，请检查 an7583.mk 里的设备名"; exit 1; }
          echo "--- package count ---"
          grep -c '^CONFIG_PACKAGE_.*=y' .config || true

      - name: Download sources
        run: make download -j8 || true

      - name: Compile
        run: make -j$(nproc) || (make -j1 V=s 2>&1 | tail -n 300; false)

      - name: Assemble U-Boot FIP (best effort)
        continue-on-error: true
        run: |
          # 仓库 tools/ 里没有 fiptool，用 TF-A 自带的构建
          if [ ! -x staging_dir/host/bin/fiptool ]; then
            git clone --depth 1 https://github.com/ARM-software/arm-trusted-firmware /tmp/atf || true
            # 必须在 TF-A 根目录跑，并给出可写的 BUILD_DIR，否则会尝试 mkdir /tools
            make -C /tmp/atf/tools/fiptool BUILD_DIR=/tmp/atf/build -j"$(nproc)" || true
            FIP=$(find /tmp/atf -type f -name fiptool -perm -u+x 2>/dev/null | head -1)
            echo "found fiptool: ${FIP:-none}"
            [ -n "$FIP" ] && cp "$FIP" staging_dir/host/bin/fiptool || true
          fi
          ls -l staging_dir/host/bin/fiptool || true
          IMG="staging_dir/target-aarch64_cortex-a53_musl/image"
          ls -l "$IMG" | head -30 || true
          if [ -f "$IMG/an7583-bl2.bin" ]; then
            staging_dir/host/bin/fiptool create --tb-fw "$IMG/an7583-bl2.bin" \
              "$IMG/an7583_hg5380a-bl2.fip" && cp "$IMG/an7583_hg5380a-bl2.fip" bin/targets/airoha/an7583/preloader.bin
          fi
          if [ -f "$IMG/an7583-bl31.lzma" ] && [ -f "$IMG/an7583_hg5380a-u-boot.lzma" ]; then
            staging_dir/host/bin/fiptool create --soc-fw "$IMG/an7583-bl31.lzma" \
              --nt-fw "$IMG/an7583_hg5380a-u-boot.lzma" "$IMG/an7583_hg5380a-bl31-u-boot.fip" && \
              cp "$IMG/an7583_hg5380a-bl31-u-boot.fip" bin/targets/airoha/an7583/bl31-uboot.fip
          fi
          ls -l bin/targets/airoha/an7583/ || true

      - name: List artifacts
        if: always()
        run: find bin/targets/airoha/an7583 -maxdepth 1 -type f -printf '%f  %s\n' 2>/dev/null || true

      - name: Verify firmware was produced
        # Upload firmware 用的是 if-no-files-found: warn，而 path 里包含
        # config.buildinfo（每次都会生成），所以这个告警永远不会触发。
        # 结果是「编译失败、一个固件都没有」也可能表现为构建成功。
        # 这里显式要求至少存在一个 sysupgrade 镜像，否则让构建失败。
        run: |
          IMG=bin/targets/airoha/an7583
          echo "--- $IMG 下的文件 ---"
          ls -l "$IMG" 2>/dev/null || true
          N=$(find "$IMG" -maxdepth 1 -type f -name '*sysupgrade*' 2>/dev/null | wc -l)
          echo "sysupgrade 镜像数量: $N"
          if [ "$N" -eq 0 ]; then
            echo "::error::没有生成任何 sysupgrade 镜像，构建虽然返回 0 但产物缺失"
            exit 1
          fi
          find "$IMG" -maxdepth 1 -type f -name '*sysupgrade*' -printf '  %f  %s 字节\n'

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hg5380a-${{ inputs.profile || 'minimal' }}
          if-no-files-found: warn
          path: |
            bin/targets/airoha/an7583/*sysupgrade*
            bin/targets/airoha/an7583/preloader.bin
            bin/targets/airoha/an7583/*.fip
            bin/targets/airoha/an7583/*.itb
            bin/targets/airoha/an7583/*.manifest
            bin/targets/airoha/an7583/config.buildinfo
