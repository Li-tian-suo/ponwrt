name: Build HG5380A (AN7583 FiberHome)

# 适配 Li-tian-suo/ponwrt（pbs05/ponwrt 的 fork）
# 前置：仓库里需要有 board/ 目录（本包提供的两个文件）
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Apply board files
        run: |
          test -f board/an7583-fiberhome-hg5380a.dts
          cp board/an7583-fiberhome-hg5380a.dts target/linux/airoha/dts/
          if ! grep -q fiberhome_hg5380a target/linux/airoha/image/an7583.mk; then
            cat board/an7583.mk.snippet >> target/linux/airoha/image/an7583.mk
          fi
          grep -n "fiberhome_hg5380a" target/linux/airoha/image/an7583.mk | head

      - name: Update feeds
        run: ./scripts/feeds update -a

      - name: Install feeds
        run: ./scripts/feeds install -a

      - name: Configure
        run: |
          cp configs/an7583.config .config
          # 换掉原来的 7583 设备选择
          sed -i '/^CONFIG_TARGET_DEVICE_airoha_an7583_DEVICE_/d' .config
          echo 'CONFIG_TARGET_DEVICE_airoha_an7583_DEVICE_fiberhome_hg5380a=y' >> .config
          # 复用你在 7581 上用的软件包集合（只取 CONFIG_PACKAGE_ 行，避免带入 target 符号）
          if [ -f configs/an7581-tyfza1-packages.config ]; then
            grep '^CONFIG_PACKAGE_' configs/an7581-tyfza1-packages.config >> .config || true
          fi
          make defconfig
          echo "--- device selection ---"
          grep -E '^CONFIG_TARGET_DEVICE_airoha' .config | grep '=y' || {
            echo "设备未被选中，请检查 an7583.mk 里的设备名"; exit 1; }

      - name: Download sources
        run: make download -j8 || true

      - name: Compile
        run: make -j$(nproc) || (make -j1 V=s 2>&1 | tail -n 300; false)

      - name: List artifacts
        if: always()
        run: find bin/targets/airoha/an7583 -maxdepth 1 -type f -printf '%f  %s\n' 2>/dev/null || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: hg5380a-firmware
          if-no-files-found: warn
          path: |
            bin/targets/airoha/an7583/*sysupgrade*
            bin/targets/airoha/an7583/preloader.bin
            bin/targets/airoha/an7583/*.fip
            bin/targets/airoha/an7583/*.itb
            bin/targets/airoha/an7583/*.manifest
            bin/targets/airoha/an7583/config.buildinfo
